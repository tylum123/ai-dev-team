name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check core.js
          node --check workflow.js
          node --check runner.js
          node --check agents.js
          node --check task-state.js
          node --check provider-config.js
          node --check public/app.js
          node --check deploy/hosted-demo.js
          node --check scripts/build.mjs
      - run: npm test
      - run: npm run build
