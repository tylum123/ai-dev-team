name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check core.js
          node --check workflow.js
          node --check runner.js
          node --check agents.js
          node --check task-state.js
          node --check provider-config.js
          node --check public/app.js
          node --check deploy/hosted-demo.js
          node --check scripts/build.mjs
      - run: npm test
      - run: npm run build
      - name: Build and smoke test demo container
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4310/api/state > /dev/null; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Remove test container
        if: always()
        run: docker compose down --volumes
