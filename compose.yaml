services:
  ai-dev-team:
    build: .
    restart: unless-stopped
    environment:
      DEMO_ONLY: "true"
    ports:
      - "127.0.0.1:4310:4310"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - task-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  task-data:
